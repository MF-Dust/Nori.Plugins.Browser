name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Nori.Plugins.Browser.slnx -c Release
      - run: dotnet test Nori.Plugins.Browser.slnx -c Release --no-build
      - run: dotnet build src/Nori.Plugins.Browser/Nori.Plugins.Browser.csproj -c Release --no-restore -t:PackNoriPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: io.nori.browser
          path: artifacts/io.nori.browser.noripack
          if-no-files-found: error
